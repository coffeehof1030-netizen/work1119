<script>
'use strict';
const byId = id => document.getElementById(id);
const source = JSON.parse(byId('source-data').textContent);
const records = source.rows.map(([topic,section,category,metric,year,month,kind,unit,value,page]) =>
  ({topic,section,category,metric,year,month,kind,unit,value,page}));
const unique = values => [...new Set(values)];
const number = (value,unit) => value.toLocaleString('ko-KR', {minimumFractionDigits:['%','만원','시간'].includes(unit)?1:0,maximumFractionDigits:1});
const append = (parent,tag,text,className) => {
  const element = document.createElement(tag);
  if (text !== undefined) element.textContent = text;
  if (className) element.className = className;
  parent.append(element);
  return element;
};
const topicButtons = Array.from(document.querySelectorAll('[data-topic]'));
const controls = Array.from(document.querySelectorAll('[data-filter]'));
const initial = {1:{section:'전체',category:'비정규직'},2:{section:'연령계층별',year:'2026'},3:{category:'비정규직',metric:'월평균임금'},4:{year:'2026',metric:'비정규직',kind:'공표 수준'}};
let topic = 1;
let selected = {...initial[1]};
let visibleRows = [];
function select(name,values) {
  const control = byId(name);
  const options = unique(values.map(String));
  const active = options.includes(selected[name]) ? selected[name] : options[0];
  control.replaceChildren();
  options.forEach(value => append(control,'option',name==='year'?value+'년 8월':value).value=value);
  control.value=active;
  selected[name]=active;
  control.closest('label').hidden=false;
  return active;
}
function refresh() {
  const all = records.filter(row => row.topic===topic);
  controls.forEach(label => label.hidden=true);
  let rows;
  let chartRows;
  let title;
  let note;
  let labelKey = 'year';
  if (topic===1) {
    const section=select('section',all.map(row=>row.section));
    const group=all.filter(row=>row.section===section);
    const category=select('category',group.map(row=>row.category));
    rows=group.filter(row=>row.category===category);
    chartRows=rows;
    title=section+' · '+category+' 추이';
  } else if (topic===2) {
    const section=select('section',all.map(row=>row.section));
    const year=Number(select('year',all.map(row=>row.year)));
    rows=all.filter(row=>row.section===section && row.year===year);
    chartRows=rows.filter(row=>row.unit==='%').sort((a,b)=>b.value-a.value);
    labelKey='category';
    title=year+'년 8월 · 비정규직 '+section+' 구성비';
    note='분모는 비정규직 근로자 전체입니다. 전체 규모(천명)는 표에서 확인할 수 있습니다.';
  } else if (topic===3) {
    const metric=select('metric',all.map(row=>row.metric));
    const category=select('category',all.map(row=>row.category));
    rows=all.filter(row=>row.metric===metric && row.category===category);
    chartRows=rows;
    title=category+' · '+metric+' 추이';
  } else {
    const year=Number(select('year',all.map(row=>row.year)));
    const group=all.filter(row=>row.year===year);
    const metric=select('metric',group.map(row=>row.metric));
    const kind=select('kind',group.map(row=>row.kind));
    rows=group.filter(row=>row.metric===metric && row.kind===kind);
    chartRows=rows.filter(row=>!['전국','전남광주'].includes(row.category)).sort((a,b)=>b.value-a.value);
    labelKey='category';
    title=year+'년 8월 · 시도별 '+metric+' '+(kind==='공표 수준'?'규모':'전년동월 증감');
    note='전국과 전남광주 합계는 아래 표에 표시합니다.';
  }
  byId('chart-title').textContent=title;
  byId('chart-note').textContent=(note?note+' ':'')+'단위 '+chartRows[0].unit;
  drawBars(chartRows,labelKey);
  visibleRows=rows;
  byId('row-count').textContent='('+rows.length+'건)';
  const body=byId('table-body');
  body.replaceChildren();
  rows.forEach(row=>{
    const tr=append(body,'tr');
    [row.year+'년 8월',row.section,row.category,row.metric,row.kind,row.unit,number(row.value,row.unit)].forEach(value=>append(tr,'td',value));
  });
}
function drawBars(rows,labelKey) {
  const host=byId('chart');
  host.replaceChildren();
  const min=Math.min(0,...rows.map(row=>row.value));
  const max=Math.max(0,...rows.map(row=>row.value));
  const span=max-min || 1;
  const zero=-min/span*100;
  rows.forEach(row=>{
    const line=append(host,'div',undefined,'bar-row');
    append(line,'span',labelKey==='year'?row.year+'년':row.category);
    const track=append(line,'div',undefined,'bar-track');
    if(min<0) append(track,'div',undefined,'axis').style.left=zero+'%';
    const fill=append(track,'div',undefined,'bar-fill '+(row.value<0?'negative':row.kind==='전년동월 증감'?'positive':''));
    fill.style.left=(row.value<0?(row.value-min)/span*100:zero)+'%';
    fill.style.width=Math.abs(row.value)/span*100+'%';
    append(line,'span',(row.kind==='전년동월 증감' && row.value>0?'+':'')+number(row.value,row.unit),'bar-value');
  });
}
const snapshot=records.filter(row=>row.topic===1 && row.section==='전체' && row.year===2026);
['임금근로자','정규직','비정규직','비정규직 비중'].forEach(category=>{
  const row=snapshot.find(item=>item.category===category);
  const card=append(byId('metrics'),'div',undefined,'metric');
  append(card,'span',category);
  const amount=append(card,'strong',number(row.value,row.unit)+' ');
  append(amount,'small',row.unit);
});
source.notes.slice(1).forEach(([label,detail])=>append(byId('notes'),'li',label+' · '+detail));
topicButtons.forEach(button=>button.addEventListener('click',()=>{
  const next=Number(button.dataset.topic);
  if(next===topic) return;
  initial[topic]={...selected};
  topic=next;
  selected={...initial[topic]};
  topicButtons.forEach(item=>item.setAttribute('aria-pressed',String(item===button)));
  refresh();
}));
controls.forEach(label=>label.querySelector('select').addEventListener('change',event=>{
  selected[label.dataset.filter]=event.target.value;
  refresh();
}));
byId('csv').addEventListener('click',()=>{
  const columns=['표 번호','분류','항목','지표','연도','월','값 구분','단위','값','PDF 쪽'];
  const lines=[columns,...visibleRows.map(r=>[r.topic,r.section,r.category,r.metric,r.year,r.month,r.kind,r.unit,r.value,r.page])];
  const quote=value=>'"'+String(value).replaceAll('"','""')+'"';
  const file=new Blob(['\uFEFF',lines.map(line=>line.map(quote).join(',')).join('\r\n')],{type:'text/csv;charset=utf-8'});
  const url=URL.createObjectURL(file);
  const link=document.createElement('a');
  link.href=url;
  link.download='근로형태별_통계표_'+topic+'.csv';
  link.click();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
});
refresh();
</script>
</body>
</html>
